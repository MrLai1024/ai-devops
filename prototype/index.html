<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI DevOps · 项目空间</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/projects" aria-label="AI DevOps 首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">AI DevOps</span>
      </a>

      <nav class="topnav" id="topnav" aria-label="应用入口"></nav>

      <div class="topbar-right">
        <div class="search-wrap">
          <svg class="search-icon icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input id="global-search" class="global-search" type="search" placeholder="搜索项目、需求、任务..." autocomplete="off" aria-label="全局搜索">
          <div id="search-results" class="search-results" role="listbox"></div>
        </div>

        <div class="notif-wrap">
          <button class="icon-btn" type="button" data-action="notifications" aria-label="通知">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
              <path d="M10 21h4"></path>
            </svg>
            <span class="badge-dot" id="notif-badge"></span>
          </button>
          <div id="notif-dropdown" class="dropdown notif-dropdown"></div>
        </div>

        <div class="avatar-wrap">
          <button class="avatar-btn" type="button" data-action="avatar" aria-label="用户菜单">
            <span class="avatar">张</span>
            <span class="avatar-meta"><b>张明</b><small>项目 Owner</small></span>
            <span class="chev">▾</span>
          </button>
          <div id="avatar-menu" class="dropdown avatar-dropdown"></div>
        </div>
      </div>
    </header>

    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="overlay" class="overlay" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
